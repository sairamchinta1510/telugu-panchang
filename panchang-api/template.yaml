AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Panchang API — Lambda + HTTP API

Globals:
  Function:
    Timeout: 10
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        PYTHONDONTWRITEBYTECODE: "1"
        PANCHANG_CACHE_BUCKET: !Ref PanchangCacheBucket

Resources:
  PanchangCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldCache
            Status: Enabled
            ExpirationInDays: 120

  PanchangCachePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "arn:aws:s3:::${PanchangCacheBucket}/*"

  PanchangFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.lambda_handler
      Description: Telugu Panchang computation API
      Events:
        PanchangGet:
          Type: HttpApi
          Properties:
            Path: /panchang
            Method: GET
            ApiId: !Ref PanchangHttpApi

  PanchangHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - "*"

  MuhoortamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler_muhoortam.lambda_handler
      Description: Telugu Muhoortam computation API
      Timeout: 30
      Policies:
        - !Ref PanchangCachePolicy
      Events:
        MuhoortamBirthChart:
          Type: HttpApi
          Properties:
            Path: /muhoortam/birth-chart
            Method: POST
            ApiId: !Ref PanchangHttpApi
        MuhoortamFind:
          Type: HttpApi
          Properties:
            Path: /muhoortam/find
            Method: POST
            ApiId: !Ref PanchangHttpApi
        MuhoortamCheck:
          Type: HttpApi
          Properties:
            Path: /muhoortam/check
            Method: POST
            ApiId: !Ref PanchangHttpApi
        MuhoortamWindowDetail:
          Type: HttpApi
          Properties:
            Path: /muhoortam/window-detail
            Method: POST
            ApiId: !Ref PanchangHttpApi

  PrecomputeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler_precompute.lambda_handler
      Description: Nightly panchang cache precompute for major Indian cities
      Timeout: 900
      MemorySize: 1024
      Policies:
        - !Ref PanchangCachePolicy
      Events:
        NightlyCron:
          Type: Schedule
          Properties:
            Schedule: "cron(0 1 * * ? *)"
            Description: "Nightly panchang precompute at 01:00 UTC (06:30 IST)"
            Enabled: true

Outputs:
  ApiEndpoint:
    Description: Panchang API endpoint URL
    Value: !Sub "https://${PanchangHttpApi}.execute-api.${AWS::Region}.amazonaws.com/panchang"
  FunctionArn:
    Value: !GetAtt PanchangFunction.Arn
  CacheBucketName:
    Description: S3 bucket for panchang precompute cache
    Value: !Ref PanchangCacheBucket
  PrecomputeFunctionArn:
    Description: ARN of the nightly precompute Lambda (for manual triggering)
    Value: !GetAtt PrecomputeFunction.Arn
